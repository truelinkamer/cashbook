<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>True Link Cash Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#1c2321;--mu:#66736e;--bd:#dfe5e2;--ac:#0f6b44;--ac2:#b3202a;--hd:#eef3f0;--in:#fafcfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--card:#1b211f;--tx:#e8eeeb;--mu:#93a19b;--bd:#2d3733;--ac:#3fbf86;--ac2:#ef6b73;--hd:#232b28;--in:#161b19}}
:root[data-theme="dark"]{--bg:#121615;--card:#1b211f;--tx:#e8eeeb;--mu:#93a19b;--bd:#2d3733;--ac:#3fbf86;--ac2:#ef6b73;--hd:#232b28;--in:#161b19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:14px}
.hd{background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;text-align:center}
.hd img{height:64px;max-width:25%;object-fit:contain}.hd small{letter-spacing:.18em;font-size:11px;color:var(--mu);text-transform:uppercase}
.hd h1{margin:4px 0;font-size:clamp(16px,3.4vw,24px)}.bar{display:flex;justify-content:center;gap:5px;margin:6px 0}.bar i{width:26px;height:3px;display:block}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.nav a,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;text-decoration:none;cursor:pointer;font:inherit;font-weight:600}
.nav a.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.d{color:var(--ac2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:13px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;border-left:4px solid var(--ac)}.k b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.k span{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}th{background:var(--hd);font-size:12px;color:var(--mu)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
td input{text-align:right;padding:4px 6px}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}.row b{font-variant-numeric:tabular-nums}
.big{font-size:18px;color:var(--ac)}.mu{color:var(--mu)}.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}.ctl label{font-size:12px;color:var(--mu);display:block}.ctl>div{min-width:140px}
.lk{display:block;text-decoration:none;color:inherit;text-align:center;padding:26px}.lk:hover{border-color:var(--ac)}.lk b{font-size:20px;display:block}
.warn{background:#fff4d6;color:#6b4e00;padding:10px 14px;border-radius:10px;margin-bottom:12px}.ok{color:var(--ac);font-weight:600}
@media print{.nav,.ctl,.noprint,.hd .bar{display:none!important}body{background:#fff}.card{border:0}}
body.ps #app>*:not(#sheet){display:none!important}@media print{:root,:root[data-theme]{--tx:#000;--mu:#444;--bd:#bbb;--card:#fff;--hd:#eee;--in:#fff}}.sig{font:italic 22px "Segoe Script","Brush Script MT",cursive;border-bottom:1px solid var(--tx);padding:0 14px;display:inline-block;min-width:150px}.sg{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:34px}.sg small{display:block;color:var(--mu)}@page{size:A4;margin:10mm}body.ps .hd{display:none!important}@media print{.pr{border:0!important;padding:0!important}}</style></head><body><div class="w">
<div class="hd"><img id="hl" alt="Amer" src="/logo-amer.png"><div><small>Cash Book System</small><h1 id="hn">True Link Government Transaction Center LLC</h1><div class="bar"><i style="background:#b3202a"></i><i style="background:#222"></i><i style="background:#0f6b44"></i></div><small style="letter-spacing:.05em;text-transform:none">Internal. Not for customers.</small></div><img id="hr" alt="True Link" src="/logo-truelink.png"></div>
<div class="nav" id="nav"></div><div id="msg"></div><div id="app"></div><div id="rf" class="mu noprint" style="text-align:center;font-size:11px;margin-top:12px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script>
<script>
const CASH={asna:'Asna',thasleena:'Thasleena'},NOTES=[1000,500,200,100,50,20,10,5],COINS=[1,0.5,0.25];
const OUTK=['Petty Cash','AMWAL','SHAKKEER/MANSOOR','NOQODI','NBD','Cash Expense'];
let days={},col=null,isAdmin=false,tab='entry',view=null,conn=false;
const $=s=>document.querySelector(s),f=n=>(+n||0).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2}),
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
dmy=s=>s.split('-').reverse().join('/'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const other=c=>c==='asna'?'thasleena':'asna';
const list=c=>Object.values(days).filter(d=>!c||d.cashier===c).sort((a,b)=>a.date<b.date?-1:1);
const prevClose=(c,date)=>{const p=list(c).filter(d=>d.date<date).pop();return p?p.closing:0};
function calc(d){const n=d.notes.reduce((s,q,i)=>s+q*NOTES[i],0)+(d.reserved=+d.reserved||0),c=d.coins.reduce((s,q,i)=>s+q*COINS[i],0),o=d.out.reduce((s,v)=>s+v,0);
 d.notesTotal=n;d.coinsTotal=c;d.closing=n+c;d.outTotal=o;d.received=d.closing+o;d.collection=d.received-d.opening;return d}
function route(){const h=location.pathname.replace(/\/+$/,'').slice(1);view=CASH[h]?h:(h==='admin'?'admin':null);tab='entry';render()}
function renderNav(){const l=[['','Home'],['asna','Asna Cash Book'],['thasleena','Thasleena Cash Book'],['admin','Admin Dashboard']];
 $('#nav').innerHTML=CASH[view]?`<b style="margin-right:12px;font-size:26px">${CASH[view]} Cash Book</b>`:l.map(([h,t])=>`<a href="/${h}" class="${(view||'')===h?'on':''}">${t}</a>`).join('');
 if(view&&CASH[view])$('#nav').innerHTML+=`<span style="flex:1"></span><button class="btn ${tab==='entry'?'p':''}" onclick="setTab('entry')">Daily Entry</button><button class="btn ${tab==='report'?'p':''}" onclick="setTab('report')">Reports</button><button class="btn ${tab==='exp'?'p':''}" onclick="setTab('exp')">Expense Sheet</button><button class="btn ${tab==='tl'||tab==='tlr'?'p':''}" onclick="setTab('tl')">True Line Cashbook</button>${view==='asna'?`<button class="btn ${tab==='admin'?'p':''}" onclick="setTab('admin')">Admin Dashboard</button>`:''}`}
function setTab(t){tab=t;render()}
function render(){window._corr=null;renderNav();setHeader();$('#msg').innerHTML=vrBanner()+(conn?'':'<div class="warn">Not connected to the shared database. Open this page signed in to claude.ai; entries cannot be saved until then.</div>');
 const a=$('#app');
 if(!view)a.innerHTML=`<div class="g g4">${['asna','thasleena'].map(c=>`<a class="card lk" href="/${c}"><b>${CASH[c]}</b><span class="mu">Cashier cash book, entry and reports</span></a>`).join('')}<a class="card lk" href="/admin"><b>Admin</b><span class="mu">Cash flow dashboard</span></a></div>`;
 else if(view==='admin'||tab==='admin')admin();else if(tab==='tl')tlEntry();else if(tab==='tlr')tlReport();else if(tab==='exp')expDay();else if(tab==='entry')entry(view);else report(view)}
/* ---------- ENTRY ---------- */
function entry(c){window._ec=c;const o=CASH[other(c)];
 $('#app').innerHTML=`<div class="noprint">${corrHtml()}<div class="card"><h2>${CASH[c]} · Daily Cash Book</h2><div class="ctl"><div><label>Date</label><input type="date" id="dt" value="${today()}"></div><div><label>Opening Balance</label><input type="number" step="0.01" id="op"></div>${c==='asna'?`<div><label>Prepared &amp; Checked By</label><select id="pb"><option>Asna</option><option>Nazik</option></select></div>`:''}<div style="flex:1"><span id="st" class="mu"></span></div></div>
 <div id="vrb"></div><div class="g g2"><div><h3>Cash Denominations</h3><div class="sc"><table><tr><th>Currency</th><th>Qty</th><th>Amount</th></tr>${NOTES.map((v,i)=>`<tr><td>${v}</td><td><input type="number" min="0" id="n${i}" oninput="upd()"></td><td id="na${i}">0.00</td></tr>`).join('')}<tr><td>Reserved Amount</td><td><input type="number" step="0.01" min="0" id="rs" oninput="upd()"></td><td id="rsa">0.00</td></tr><tr><th>Total</th><th id="nq">0</th><th id="nt">0.00</th></tr></table></div></div>
 <div><h3>Coin Denominations</h3><div class="sc"><table><tr><th>Coin</th><th>Qty</th><th>Amount</th></tr>${COINS.map((v,i)=>`<tr><td>${v}</td><td><input type="number" min="0" id="c${i}" oninput="upd()"></td><td id="ca${i}">0.00</td></tr>`).join('')}<tr><th>Total</th><th id="cq">0</th><th id="ct">0.00</th></tr></table></div>
 <h3 style="margin-top:16px">Cash Closing Balance</h3><div class="row"><span>Closing balance</span><b class="big" id="cl">0.00</b></div></div></div></div>
 <div class="g g2"><div class="card"><h3>Amounts Handed Over / Paid</h3>${OUTK.map((t,i)=>`<div class="row"><span>${t}</span><input type="number" step="0.01" min="0" id="o${i}" oninput="upd()" style="width:140px"></div>`).join('')}<div class="row"><span>Remarks</span><input id="rm" style="width:60%" placeholder="optional"></div></div>
 <div class="card"><h3>Summary</h3><div class="row"><span>Total handed over / paid</span><b id="ot">0.00</b></div><div class="row"><span>Total cash received</span><b id="tr">0.00</b></div><div class="row"><span>Today's collection (received − opening)</span><b id="co">0.00</b></div><div class="row"><span>Opening for next day</span><b class="big" id="nx">0.00</b></div><p style="margin-top:14px">${window._corr?`<button class="btn p" onclick="save()">Save correction</button> <button class="btn" onclick="cancelCorr()">Cancel</button>`:`<button class="btn p" onclick="save(1)">Save &amp; Print Day Sheet</button> <button class="btn" onclick="save()">Save only</button>`} <button class="btn d" onclick="del()">Delete this day</button> <span id="sv" class="ok"></span></p></div></div></div><div id="sheet"></div>`;
 $('#dt').onchange=()=>load(c);$('#op').oninput=()=>{$('#op').dataset.m=1;upd()};load(c);$('#app').oninput=()=>{eDirty=true}}
function load(c){eDirty=false;const dt=$('#dt').value,d=days[c+'_'+dt],sr=d||list(c).filter(x=>x.date<dt).pop();$('#sv').textContent='';
 $('#op').dataset.m='';$('#op').value=d?d.opening:prevClose(c,dt);
 NOTES.forEach((_,i)=>$('#n'+i).value=sr?sr.notes[i]||'':'');COINS.forEach((_,i)=>$('#c'+i).value=sr?sr.coins[i]||'':'');
 for(let i=0;i<6;i++)$('#o'+i).value=d?d.out[i]||'':'';$('#rs').value=sr?sr.reserved||'':'';$('#vrb').innerHTML=vrHtml(d);if($('#pb'))$('#pb').value=d&&d.preparedBy?d.preparedBy:'Asna';$('#rm').value=d?d.remarks||'':'';
 $('#st').textContent=d?'Editing a saved entry for this date.':'New entry. Opening balance and denominations are copied from the previous day; change them if the cash count differs.';upd()}
function cur(){const g=id=>+$(id).value||0;return calc({cashier:window._ec,date:$('#dt').value,opening:g('#op'),reserved:g('#rs'),preparedBy:$('#pb')?$('#pb').value:CASH[window._ec],notes:NOTES.map((_,i)=>g('#n'+i)),coins:COINS.map((_,i)=>g('#c'+i)),out:[0,1,2,3,4,5].map(i=>g('#o'+i)),remarks:$('#rm').value.trim()})}
function upd(){const d=cur();NOTES.forEach((v,i)=>$('#na'+i).textContent=f(d.notes[i]*v));COINS.forEach((v,i)=>$('#ca'+i).textContent=f(d.coins[i]*v));
 $('#nq').textContent=d.notes.reduce((a,b)=>a+b,0);$('#cq').textContent=d.coins.reduce((a,b)=>a+b,0);$('#nt').textContent=f(d.notesTotal);$('#rsa').textContent=f(d.reserved);$('#ct').textContent=f(d.coinsTotal);
 $('#cl').textContent=f(d.closing);$('#ot').textContent=f(d.outTotal);$('#tr').textContent=f(d.received);$('#co').textContent=f(d.collection);$('#nx').textContent=f(d.closing)}
async function save(p){if(!col)return alert('Not connected to the database.');const d=cur();if(!d.date)return alert('Pick a date.');d.updated=Date.now();{const old=days[d.cashier+'_'+d.date];if(old&&old.vr)d.vr=old.vr.map(x=>x.open?{...x,open:false,doneAt:Date.now()}:x)}
 if(window._corr){const t=($('#ct')||{}).value;if(!t||!t.trim())return alert('Please type the remark for the cashier.');const by=$('#cv').value,o2=days[d.cashier+'_'+d.date];d.vr=[...(d.vr||[]),{by,text:t.trim(),at:Date.now(),open:false,corrected:true,was:o2?{closing:o2.closing,received:o2.received}:null}];d.verifiedBy=by;d.verifiedAt=today()}

 try{const {error}=await sb.from('cash_days').upsert({id:d.cashier+'_'+d.date,cashier:d.cashier,day:d.date,payload:d});if(error)throw error;days[d.cashier+'_'+d.date]=d;eDirty=false;$('#sv').textContent='Saved ✓';$('#msg').innerHTML=vrBanner();if(window._corr){window._corr=null;tab=window._back||'entry';render();return}sheet(d);if(p)setTimeout(printSheet,400)}catch(e){alert('Could not save: '+(e.message||e.code))}}
async function del(){const d=$('#dt').value,id=window._ec+'_'+d;if(!days[id])return;if(!confirm('Delete the entry for '+dmy(d)+'?'))return;try{const {error}=await sb.from('cash_days').delete().eq('id',id);if(error)throw error;delete days[id];load(window._ec)}catch(e){alert('Could not delete: '+(e.message||e.code))}}
function printSheet(){const t0=document.title;if(window._pt)document.title=window._pt;document.body.classList.add('ps');try{print()}catch(e){alert('Printing is blocked in this view. Use Download sheet, then print the file.')}setTimeout(()=>{document.body.classList.remove('ps');document.title=t0},1500)}
async function dlSheet(){if(!dl)return alert('Download not available here.');const el=$('#sheet').cloneNode(true);el.querySelectorAll('.noprint').forEach(x=>x.remove());
 const h=`<!DOCTYPE html><meta charset=utf-8><title>Cash Book ${_sd.date}</title><style>${PRCSS}body{margin:16px;background:#fff}.pr{border:0}@page{size:A4;margin:10mm}</style>${el.innerHTML.replace(/src="\//g,'src="'+location.origin+'/')}`;
 try{await dl.save({filename:(window._pt||'Cashbook')+'.html',data:h})}catch(e){}}
function printReport(c){const m=$('#mo').value,L=list(c).filter(d=>d.date.startsWith(m));if(!L.length)return alert('No entries this month.');
 const oo=i=>L.reduce((a,d)=>a+d.out[i],0),S=k=>L.reduce((a,d)=>a+d[k],0),mn=new Date(m+'-01T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'}),vf=L.filter(d=>d.verifiedBy).length;
 $('#sheet').innerHTML=`<div class="pr rt"><div class="lh"><img alt="" src="/logo-amer.png"><div><h1>True Link Government Transaction Center LLC</h1><div class="tri"><i style="background:#b3202a"></i><i style="background:#222"></i><i style="background:#0f6b44"></i></div><small>Cash Book</small></div><img alt="" src="/logo-truelink.png"></div>
<div class="tt">MONTHLY CASH REPORT</div>
<div class="mt"><div><small>Cashier</small><b>${CASH[c]}</b></div><div><small>Period</small><b>${mn}</b></div><div><small>Entries</small><b>${L.length}</b></div><div><small>Verified</small><b>${vf} of ${L.length}</b></div></div>
<table><tr><th>Date</th><th>Opening</th><th>Closing</th>${OUTK.map(t=>`<th>${t}</th>`).join('')}<th>Total Received</th><th>Collection</th><th>Prepared By</th><th>Verified By</th><th>Verifier Remarks</th></tr>${L.map(d=>`<tr><td>${dmy(d.date)}</td><td>${f(d.opening)}</td><td>${f(d.closing)}</td>${d.out.map(v=>`<td>${f(v)}</td>`).join('')}<td><b>${f(d.received)}</b></td><td>${f(d.collection)}</td><td>${esc(d.preparedBy||CASH[c])}</td><td>${d.verifiedBy?esc(d.verifiedBy):'Pending'}</td><td style="font-size:9px">${esc(vrText(d))}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td></td><td></td>${[0,1,2,3,4,5].map(i=>`<td>${f(oo(i))}</td>`).join('')}<td></td><td>${f(S('collection'))}</td><td></td><td></td><td></td></tr></table>
<div class="sg"><div><span class="sig">${[...new Set(L.map(d=>d.preparedBy||CASH[c]))].join(' / ')}</span><small>Prepared &amp; Checked By</small></div><div><span class="sig">&nbsp;</span><small>Verified By</small></div></div>
<div class="ft"><span>True Link Cash Book · Internal document</span><span>Printed ${new Date().toLocaleString('en-GB')}</span></div></div>`;
 const st=document.createElement('style');st.textContent='@page{size:A4 landscape;margin:8mm}';document.head.appendChild(st);document.body.classList.add('ps');
 const t0=document.title;document.title=CASH[c]+' Cashbook Report '+mn;try{print()}catch(e){alert('Printing is blocked in this view.')}setTimeout(()=>{document.body.classList.remove('ps');st.remove();document.title=t0},1500)}
/* ---------- REPORT ---------- */
function rowsOf(d){return `<tr><td>${dmy(d.date)}</td><td>${f(d.opening)}</td><td>${f(d.closing)}</td>${d.out.map(v=>`<td>${f(v)}</td>`).join('')}<td><b>${f(d.received)}</b></td><td>${f(d.collection)}</td><td>${esc(d.preparedBy||CASH[d.cashier])}</td><td>${d.verifiedBy?esc(d.verifiedBy):'<span class="mu">Pending</span>'}</td><td>${vrCell(d)}</td><td>${d.verifiedBy?`<button class="btn" onclick="event.stopPropagation();sheet(days['${d.cashier}_${d.date}']);setTimeout(printSheet,300)">Print</button>`:'<span class="mu">—</span>'}</td></tr>`}
const HEAD=c=>`<tr><th>Date</th><th>Opening</th><th>Closing</th>${OUTK.map(t=>`<th>${t}</th>`).join('')}<th>Total Received</th><th>Collection</th><th>Prepared By</th><th>Verified</th><th>Verifier Remarks</th><th>Print</th></tr>`;
function report(c){const m=window._m||today().slice(0,7);
 $('#app').innerHTML=`<div class="card"><h2>${CASH[c]} · Reports</h2><div class="ctl noprint"><div><label>Month</label><input type="month" id="mo" value="${m}"></div><button class="btn" onclick="csv('${c}')">Download CSV</button><button class="btn" onclick="printReport('${c}')">Print Report</button></div><div id="rp"></div></div><div id="sheet"></div>`;
 $('#mo').onchange=()=>{window._m=$('#mo').value;rp(c)};rp(c)}
function rp(c){const m=$('#mo').value,L=list(c).filter(d=>d.date.startsWith(m));
 const s=k=>L.reduce((a,d)=>a+(k==='o'?0:d[k]),0),oo=i=>L.reduce((a,d)=>a+d.out[i],0);
 $('#rp').innerHTML=L.length?`<div class="sc"><table>${HEAD(c)}${L.map(rowsOf).join('')}<tr><th>Total</th><th></th><th></th>${[0,1,2,3,4,5].map(i=>`<th>${f(oo(i))}</th>`).join('')}<th>${f(s('received'))}</th><th>${f(s('collection'))}</th><th></th><th></th><th></th><th></th></tr></table></div><p class="mu noprint">Click a date to view the day sheet.</p>`:'<p class="mu">No entries for this month.</p>';
 $('#rp').querySelectorAll('tr').forEach((r,i)=>{const d=L[i-1];if(d){r.style.cursor='pointer';r.onclick=()=>sheet(d)}});$('#sheet').innerHTML=''}
const PRCSS=`.pr{background:#fff;color:#111;font:12px/1.4 "Segoe UI",Arial,sans-serif;padding:14px 18px;border:1px solid #cfd6d2;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr *{box-sizing:border-box}.pr tr{page-break-inside:avoid}.pr .bn{background:#a2c4c9;border:1px solid #333;text-align:center;font-size:17px;font-weight:700;padding:6px;margin:10px 0;color:#111}.pr .mm{margin-bottom:14px}.pr .mm .mh{background:#fbd5a5;text-align:center;font-weight:700;font-size:13px;color:#111}.pr .mm .gh th{background:#d9d9d9;text-transform:none;font-size:12px;text-align:center}.pr .mm td:nth-child(2){text-align:left}.pr .mm td:first-child{text-align:center}.pr .mm .gt td{background:#d9d9d9;font-weight:700;color:#b3202a}.pr .sm{width:60%;margin:0 auto 14px}.pr .sm td:first-child{text-align:center;font-weight:700}.pr .sm td:last-child{color:#b3202a;font-weight:700;text-align:center}.pr .sm .gt td:first-child{color:#111}.pr .lh{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center}.pr .lh img{height:52px;max-width:22%;object-fit:contain}

function setHeader(){const on=!!CASH[view]&&(tab==='tl'||tab==='tlr');const a=$('#hl'),b=$('#hr'),n=$('#hn');if(!a)return;a.src=on?'/logo-tawjeeh.png':'/logo-amer.png';b.src=on?'/logo-trueline.png':'/logo-truelink.png';n.textContent=on?TLN:'True Link Government Transaction Center LLC'}
/* ---------- ADMIN ---------- */
const vrWas=x=>x.was?` (was: closing ${f(x.was.closing)}, received ${f(x.was.received)})`:'',vrLast=d=>d.vr&&d.vr.length?d.vr[d.vr.length-1]:null,
 vrText=d=>{const x=vrLast(d);return x?(x.open?'Correction requested: ':x.corrected?'Corrected: ':'')+x.text+' ('+x.by+')'+vrWas(x):''},
 vrCell=d=>{const x=vrLast(d);return x?`${x.open?'<b style="color:#b3202a">\u26a0 </b>':x.corrected?'<b>Corrected: </b>':''}${esc(x.text)} <span class="mu">(${esc(x.by)})${vrWas(x)}</span>`:'<span class="mu">\u2014</span>'},
 vrHtml=d=>d&&d.vr&&d.vr.length?`<div class="warn">${d.vr.slice(-3).map(x=>`<div>${x.open?'\u26a0 <b>Correction requested</b>':x.corrected?'<b>Corrected</b>':'Remark'} by ${esc(x.by)} (${new Date(x.at).toLocaleDateString('en-GB')}): ${esc(x.text)}${vrWas(x)}</div>`).join('')}</div>`:'';
function vrBanner(){if(!CASH[view])return'';const op=list(view).filter(d=>(d.vr||[]).some(x=>x.open));return op.length?`<div class="warn"><b>Correction requested by verifier:</b> ${op.map(d=>`<button class="btn" onclick="goDay('${d.date}')">${dmy(d.date)}</button>`).join(' ')}</div>`:''}
function corrHtml(){return window._corr?`<div class="warn"><b>Correction mode</b> · you are correcting a saved day. The remark below is shown to the cashier in her report.<div class="ctl" style="margin:8px 0 0"><div><label>Verifier</label><select id="cv"><option>Asna</option><option>Shabeeb</option></select></div><div style="flex:1;min-width:240px"><label>Remark for the cashier (required)</label><textarea id="ct" rows="2" placeholder="e.g. 500 note count was short by 2, corrected"></textarea></div></div></div>`:''}
function correctDay(id){const d=days[id];if(!d)return;window._corr=id;window._back=tab;entry(d.cashier);$('#dt').value=d.date;$('#dt').disabled=true;load(d.cashier)}
function cancelCorr(){window._corr=null;tab=window._back||'entry';render()}
function goDay(dt){tab='entry';render();$('#dt').value=dt;load(view)}
function remarkDlg(id){const d=days[id];if(!d)return;
 $('#sheet').innerHTML=`<div class="card noprint"><h2>Remark / correction \u00b7 ${CASH[d.cashier]} \u00b7 ${dmy(d.date)}</h2>${(d.vr||[]).map(x=>`<div class="mu">${new Date(x.at).toLocaleDateString('en-GB')} \u00b7 ${esc(x.by)}: ${esc(x.text)}${x.open?' <b style="color:#b3202a">(open)</b>':''}</div>`).join('')}<div class="ctl" style="margin-top:10px"><div><label>Verifier</label><select id="rv"><option>Asna</option><option>Shabeeb</option></select></div><div style="flex:1;min-width:240px"><label>Remark</label><textarea id="rt" rows="2" placeholder="e.g. 500 note count is short by 2"></textarea></div></div><p><button class="btn p" onclick="saveRemark('${id}')">Save remark</button> <button class="btn" onclick="$('#sheet').innerHTML=''">Cancel</button></p></div>`;$('#sheet').scrollIntoView({behavior:'smooth'})}
async function saveRemark(id){const d=days[id],t=$('#rt').value.trim();if(!t)return alert('Please type the remark.');const open=false;
 d.vr=[...(d.vr||[]),{by:$('#rv').value,text:t,at:Date.now(),open}];if(open){delete d.verifiedBy;delete d.verifiedAt}
 try{const {error}=await sb.from('cash_days').upsert({id,cashier:d.cashier,day:d.date,payload:d});if(error)throw error;$('#sheet').innerHTML='';ad()}catch(e){alert('Could not save: '+(e.message||e))}}
function vcell(d){const id=d.cashier+'_'+d.date,oc=(d.vr||[]).some(x=>x.open)?'<span style="color:#b3202a;font-weight:600">⚠ Correction pending</span> ':'',sh=`${oc}<button class="btn" onclick="sheet(days['${id}'])">Sheet</button> <button class="btn" onclick="correctDay('${id}')">Correct</button> <button class="btn" onclick="remarkDlg('${id}')">Remark</button>`;
 return d.verifiedBy?`<span class="ok">✓ ${esc(d.verifiedBy)}</span> <button class="btn" onclick="unverify('${id}')">Undo</button> ${sh} <button class="btn p" onclick="sheet(days['${id}']);setTimeout(printSheet,300)">Print</button>`:`<select id="vs_${id}" style="width:auto"><option>Asna</option><option>Shabeeb</option></select> <button class="btn p" onclick="verify('${id}')">Verify</button> ${sh}`}
async function setV(id,by){const d=days[id];if(!d)return;if(by){d.verifiedBy=by;d.verifiedAt=today();(d.vr||[]).forEach(x=>{if(x.open){x.open=false;x.doneAt=Date.now()}})}else{delete d.verifiedBy;delete d.verifiedAt}
 try{const {error}=await sb.from('cash_days').upsert({id,cashier:d.cashier,day:d.date,payload:d});if(error)throw error;ad()}catch(e){alert('Could not update: '+(e.message||e))}}
function verify(id){setV(id,$('#vs_'+id).value)}function unverify(id){if(confirm('Remove verification?'))setV(id,null)}
function adminFlow(){if(!isAdmin){$('#app').innerHTML='<div class="card"><h2>Admin Dashboard</h2><p class="mu">Admin access only. Please open this page as the owner or an editor.</p></div>';return}
 const t=today(),m=t.slice(0,7);window._f=window._f||m+'-01';window._t=window._t||t;
 $('#app').innerHTML=`<div class="ctl"><div><label>From</label><input type="date" id="f1" value="${window._f}"></div><div><label>To</label><input type="date" id="t1" value="${window._t}"></div><div><label>Cashier</label><select id="cs"><option value="">Both</option><option value="asna">Asna</option><option value="thasleena">Thasleena</option></select></div><button class="btn" onclick="csv('',1)">Download CSV (all)</button></div><div id="ad"></div>`;
 ['f1','t1','cs'].forEach(i=>$('#'+i).onchange=()=>{window._f=$('#f1').value;window._t=$('#t1').value;ad()});ad()}
function ad(){if(!$('#f1'))return;const a=$('#f1').value,b=$('#t1').value,c=$('#cs').value;if(!$('#ad'))return;
 const L=list(c).filter(d=>d.date>=a&&d.date<=b),S=k=>L.reduce((x,d)=>x+d[k],0),O=i=>L.reduce((x,d)=>x+d.out[i],0);
 const last=k=>{const p=list(k).pop();return p?p.closing:0};
 const kp=(t,v,col)=>`<div class="k" ${col?`style="border-left-color:${col}"`:''}><span>${t}</span><b>${f(v)}</b></div>`;
 // chart: collection per date, per cashier
 const ds=[...new Set(L.map(d=>d.date))],val=(k,x)=>(days[k+'_'+x]||{collection:0}).collection,mx=Math.max(1,...ds.flatMap(x=>['asna','thasleena'].map(k=>val(k,x)))),W=Math.max(560,ds.length*54),H=190;
 const bars=ds.map((x,i)=>['asna','thasleena'].map((k,j)=>{const h=Math.max(0,val(k,x))/mx*(H-40);return `<rect x="${i*54+10+j*20}" y="${H-24-h}" width="18" height="${h}" rx="3" fill="${j?'#b3202a':'#0f6b44'}"><meta name="robots" content="noindex"><title>${CASH[k]} ${dmy(x)}: ${f(val(k,x))}</title></rect>`}).join('')+`<text x="${i*54+30}" y="${H-8}" font-size="10" text-anchor="middle" fill="currentColor">${x.slice(5).split('-').reverse().join('/')}</text>`).join('');
 $('#ad').innerHTML=`<div class="g g4" style="margin-bottom:14px">${kp('Total cash received',S('received'))}${kp("Collection (received − opening)",S('collection'))}${kp('Total handed over / paid',S('outTotal'),'#b3202a')}<div class="k" style="border-left-color:#b3202a"><span>Pending verification</span><b>${L.filter(d=>!d.verifiedBy).length}</b></div>${kp('Asna closing (latest)',last('asna'),'#222')}${kp('Thasleena closing (latest)',last('thasleena'),'#222')}</div>
 <div class="g g2"><div class="card"><h2>Where the cash went</h2>${OUTK.map((t,i)=>`<div class="row"><span>${t}</span><b>${f(O(i))}</b></div>`).join('')}</div>
 <div class="card"><h2>Daily collection</h2><div class="sc">${ds.length?`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${bars}</svg>`:'<p class="mu">No data in range.</p>'}</div><span class="mu"><b style="color:#0f6b44">■</b> Asna &nbsp; <b style="color:#b3202a">■</b> Thasleena</span></div></div>
 <div class="card"><h2>All entries</h2><div class="sc"><table><tr><th>Date</th><th>Cashier</th><th>Opening</th><th>Closing</th><th>Handed over / paid</th><th>Total received</th><th>Collection</th><th>Verification</th></tr>${L.slice().reverse().map(d=>`<tr><td>${dmy(d.date)}</td><td style="text-align:left">${CASH[d.cashier]}${d.preparedBy&&d.preparedBy!==CASH[d.cashier]?' ('+esc(d.preparedBy)+')':''}</td><td>${f(d.opening)}</td><td>${f(d.closing)}</td><td>${f(d.outTotal)}</td><td><b>${f(d.received)}</b></td><td>${f(d.collection)}</td><td style="white-space:nowrap">${vcell(d)}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">No entries.</td></tr>'}</table></div></div><div id="sheet"></div>`}

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=filename;a.click()}};
async function loadDays(){const {data,error}=await sb.from('cash_days').select('id,payload');if(error){$('#msg').innerHTML='<div class="warn">Could not load data: '+esc(error.message)+'</div>';return}days={};data.forEach(r=>{const v=r.payload;if(v&&v.notes){if(v.out.length===7){v.out=v.out.slice(1);calc(v)}days[r.id]=v}})}
async function boot(){isAdmin=['/admin','/asna'].includes(location.pathname.replace(/\/+$/,''));col=true;conn=true;await loadDays();await loadT();route();setInterval(autoRefresh,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefresh()})}
boot();
