<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>True Link Cash Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#1c2321;--mu:#66736e;--bd:#dfe5e2;--ac:#0f6b44;--ac2:#b3202a;--hd:#eef3f0;--in:#fafcfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--card:#1b211f;--tx:#e8eeeb;--mu:#93a19b;--bd:#2d3733;--ac:#3fbf86;--ac2:#ef6b73;--hd:#232b28;--in:#161b19}}
:root[data-theme="dark"]{--bg:#121615;--card:#1b211f;--tx:#e8eeeb;--mu:#93a19b;--bd:#2d3733;--ac:#3fbf86;--ac2:#ef6b73;--hd:#232b28;--in:#161b19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:14px}
.hd{background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;text-align:center}
.hd img{height:64px;max-width:25%;object-fit:contain}.hd small{letter-spacing:.18em;font-size:11px;color:var(--mu);text-transform:uppercase}
.hd h1{margin:4px 0;font-size:clamp(16px,3.4vw,24px)}.bar{display:flex;justify-content:center;gap:5px;margin:6px 0}.bar i{width:26px;height:3px;display:block}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.nav a,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;text-decoration:none;cursor:pointer;font:inherit;font-weight:600}
.nav a.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.d{color:var(--ac2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:13px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;border-left:4px solid var(--ac)}.k b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.k span{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}th{background:var(--hd);font-size:12px;color:var(--mu)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}input,select,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
td input{text-align:right;padding:4px 6px}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}.row b{font-variant-numeric:tabular-nums}
.big{font-size:18px;color:var(--ac)}.mu{color:var(--mu)}.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}.ctl label{font-size:12px;color:var(--mu);display:block}.ctl>div{min-width:140px}
.lk{display:block;text-decoration:none;color:inherit;text-align:center;padding:26px}.lk:hover{border-color:var(--ac)}.lk b{font-size:20px;display:block}
.warn{background:#fff4d6;color:#6b4e00;padding:10px 14px;border-radius:10px;margin-bottom:12px}.ok{color:var(--ac);font-weight:600}
@media print{.nav,.ctl,.noprint,.hd .bar{display:none!important}body{background:#fff}.card{border:0}}
body.ps #app>*:not(#sheet){display:none!important}@media print{:root,:root[data-theme]{--tx:#000;--mu:#444;--bd:#bbb;--card:#fff;--hd:#eee;--in:#fff}}</style></head><body><div class="w">
<div class="hd"><img alt="Amer" src="/logo-amer.png"><div><small>Cash Book System</small><h1>True Link Government Transaction Center LLC</h1><div class="bar"><i style="background:#b3202a"></i><i style="background:#222"></i><i style="background:#0f6b44"></i></div><small style="letter-spacing:.05em;text-transform:none">Internal. Not for customers.</small></div><img alt="True Link" src="/logo-truelink.png"></div>
<div class="nav" id="nav"></div><div id="msg"></div><div id="app"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script>
<script>
const CASH={asna:'Asna',thasleena:'Thasleena'},NOTES=[1000,500,200,100,50,20,10,5],COINS=[1,0.5,0.25];
const OUTK=['Petty Cash','AMWAL','SHAKKEER','NOQODI','NBD','Cash Expense'];
let days={},col=null,isAdmin=false,tab='entry',view=null,conn=false;
const $=s=>document.querySelector(s),f=n=>(+n||0).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2}),
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
dmy=s=>s.split('-').reverse().join('/'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const other=c=>c==='asna'?'thasleena':'asna';
const list=c=>Object.values(days).filter(d=>!c||d.cashier===c).sort((a,b)=>a.date<b.date?-1:1);
const prevClose=(c,date)=>{const p=list(c).filter(d=>d.date<date).pop();return p?p.closing:0};
function calc(d){const n=d.notes.reduce((s,q,i)=>s+q*NOTES[i],0),c=d.coins.reduce((s,q,i)=>s+q*COINS[i],0),o=d.out.reduce((s,v)=>s+v,0);
 d.notesTotal=n;d.coinsTotal=c;d.closing=n+c;d.outTotal=o;d.received=d.closing+o;d.collection=d.received-d.opening;return d}
function route(){const h=location.pathname.replace(/\/+$/,'').slice(1);view=CASH[h]?h:(h==='admin'?'admin':null);tab='entry';render()}
function renderNav(){const l=[['','Home'],['asna','Asna Cash Book'],['thasleena','Thasleena Cash Book'],['admin','Admin Dashboard']];
 $('#nav').innerHTML=CASH[view]?`<b style="margin-right:8px">${CASH[view]} Cash Book</b>`:l.map(([h,t])=>`<a href="/${h}" class="${(view||'')===h?'on':''}">${t}</a>`).join('');
 if(view&&CASH[view])$('#nav').innerHTML+=`<span style="flex:1"></span><button class="btn" onclick="logout()">Sign out</button><button class="btn ${tab==='entry'?'p':''}" onclick="setTab('entry')">Daily Entry</button><button class="btn ${tab==='report'?'p':''}" onclick="setTab('report')">Reports</button>`}
function setTab(t){tab=t;render()}
function render(){renderNav();if(!CASH[view])$('#nav').insertAdjacentHTML('beforeend','<span style="flex:1"></span><button class="btn" onclick="logout()">Sign out</button>');$('#msg').innerHTML=conn?'':'<div class="warn">Not connected to the shared database. Open this page signed in to claude.ai; entries cannot be saved until then.</div>';
 const a=$('#app');
 if(!view)a.innerHTML=`<div class="g g4">${['asna','thasleena'].map(c=>`<a class="card lk" href="/${c}"><b>${CASH[c]}</b><span class="mu">Cashier cash book, entry and reports</span></a>`).join('')}<a class="card lk" href="/admin"><b>Admin</b><span class="mu">Cash flow dashboard</span></a></div>`;
 else if(view==='admin')admin();else if(tab==='entry')entry(view);else report(view)}
/* ---------- ENTRY ---------- */
function entry(c){const o=CASH[other(c)];
 $('#app').innerHTML=`<div class="noprint"><div class="card"><h2>${CASH[c]} · Daily Cash Book</h2><div class="ctl"><div><label>Date</label><input type="date" id="dt" value="${today()}"></div><div><label>Opening Balance</label><input type="number" step="0.01" id="op"></div><div style="flex:1"><span id="st" class="mu"></span></div></div>
 <div class="g g2"><div><h3>Cash Denominations</h3><div class="sc"><table><tr><th>Currency</th><th>Qty</th><th>Amount</th></tr>${NOTES.map((v,i)=>`<tr><td>${v}</td><td><input type="number" min="0" id="n${i}" oninput="upd()"></td><td id="na${i}">0.00</td></tr>`).join('')}<tr><th>Total</th><th id="nq">0</th><th id="nt">0.00</th></tr></table></div></div>
 <div><h3>Coin Denominations</h3><div class="sc"><table><tr><th>Coin</th><th>Qty</th><th>Amount</th></tr>${COINS.map((v,i)=>`<tr><td>${v}</td><td><input type="number" min="0" id="c${i}" oninput="upd()"></td><td id="ca${i}">0.00</td></tr>`).join('')}<tr><th>Total</th><th id="cq">0</th><th id="ct">0.00</th></tr></table></div>
 <h3 style="margin-top:16px">Cash Closing Balance</h3><div class="row"><span>Closing balance</span><b class="big" id="cl">0.00</b></div></div></div></div>
 <div class="g g2"><div class="card"><h3>Amounts Handed Over / Paid</h3>${[`Amount to ${o} Cashier`,...OUTK].map((t,i)=>`<div class="row"><span>${t}</span><input type="number" step="0.01" min="0" id="o${i}" oninput="upd()" style="width:140px"></div>`).join('')}<div class="row"><span>Remarks</span><input id="rm" style="width:60%" placeholder="optional"></div></div>
 <div class="card"><h3>Summary</h3><div class="row"><span>Total handed over / paid</span><b id="ot">0.00</b></div><div class="row"><span>Total cash received</span><b id="tr">0.00</b></div><div class="row"><span>Today's collection (received − opening)</span><b id="co">0.00</b></div><div class="row"><span>Opening for next day</span><b class="big" id="nx">0.00</b></div><p style="margin-top:14px"><button class="btn p" onclick="save(1)">Save &amp; Print Day Sheet</button> <button class="btn" onclick="save()">Save only</button> <button class="btn d" onclick="del()">Delete this day</button> <span id="sv" class="ok"></span></p></div></div></div><div id="sheet"></div>`;
 $('#dt').onchange=()=>load(c);$('#op').oninput=()=>{$('#op').dataset.m=1;upd()};load(c)}
function load(c){const dt=$('#dt').value,d=days[c+'_'+dt];$('#sv').textContent='';
 $('#op').dataset.m='';$('#op').value=d?d.opening:prevClose(c,dt);
 NOTES.forEach((_,i)=>$('#n'+i).value=d?d.notes[i]||'':'');COINS.forEach((_,i)=>$('#c'+i).value=d?d.coins[i]||'':'');
 for(let i=0;i<7;i++)$('#o'+i).value=d?d.out[i]||'':'';$('#rm').value=d?d.remarks||'':'';
 $('#st').textContent=d?'Editing a saved entry for this date.':'New entry. Opening balance is taken from the previous closing.';upd()}
function cur(){const g=id=>+$(id).value||0;return calc({cashier:view,date:$('#dt').value,opening:g('#op'),notes:NOTES.map((_,i)=>g('#n'+i)),coins:COINS.map((_,i)=>g('#c'+i)),out:[0,1,2,3,4,5,6].map(i=>g('#o'+i)),remarks:$('#rm').value.trim()})}
function upd(){const d=cur();NOTES.forEach((v,i)=>$('#na'+i).textContent=f(d.notes[i]*v));COINS.forEach((v,i)=>$('#ca'+i).textContent=f(d.coins[i]*v));
 $('#nq').textContent=d.notes.reduce((a,b)=>a+b,0);$('#cq').textContent=d.coins.reduce((a,b)=>a+b,0);$('#nt').textContent=f(d.notesTotal);$('#ct').textContent=f(d.coinsTotal);
 $('#cl').textContent=f(d.closing);$('#ot').textContent=f(d.outTotal);$('#tr').textContent=f(d.received);$('#co').textContent=f(d.collection);$('#nx').textContent=f(d.closing)}
async function save(p){if(!col)return alert('Not connected to the database.');const d=cur();if(!d.date)return alert('Pick a date.');d.updated=Date.now();
 try{const {error}=await sb.from('cash_days').upsert({id:d.cashier+'_'+d.date,cashier:d.cashier,day:d.date,payload:d});if(error)throw error;days[d.cashier+'_'+d.date]=d;$('#sv').textContent='Saved ✓';sheet(d);if(p)setTimeout(printSheet,400)}catch(e){alert('Could not save: '+(e.message||e.code))}}
async function del(){const d=$('#dt').value,id=view+'_'+d;if(!days[id])return;if(!confirm('Delete the entry for '+dmy(d)+'?'))return;try{const {error}=await sb.from('cash_days').delete().eq('id',id);if(error)throw error;delete days[id];load(view)}catch(e){alert('Could not delete: '+(e.message||e.code))}}
function printSheet(){document.body.classList.add('ps');try{print()}catch(e){alert('Printing is blocked in this view. Use Download sheet, then print the file.')}setTimeout(()=>document.body.classList.remove('ps'),1500)}
async function dlSheet(){if(!dl)return alert('Download not available here.');const el=$('#sheet').cloneNode(true);el.querySelectorAll('.noprint').forEach(x=>x.remove());
 const h=`<!DOCTYPE html><meta charset=utf-8><title>Cash Book</title><style>body{font:14px system-ui;margin:24px}table{width:100%;border-collapse:collapse}td{padding:5px 8px;border-bottom:1px solid #ccc;text-align:right}td:first-child{text-align:left}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #bbb}.g{display:grid;grid-template-columns:1fr 1fr;gap:24px}h1{text-align:center;font-size:18px}h2{font-size:16px}</style><h1>True Link Government Transaction Center LLC</h1>${el.innerHTML}`;
 try{await dl.save({filename:'cashbook-'+_sd.cashier+'-'+_sd.date+'.html',data:h})}catch(e){}}
/* ---------- REPORT ---------- */
function rowsOf(d){return `<tr><td>${dmy(d.date)}</td><td>${f(d.opening)}</td><td>${f(d.closing)}</td>${d.out.map(v=>`<td>${f(v)}</td>`).join('')}<td><b>${f(d.received)}</b></td><td>${f(d.collection)}</td></tr>`}
const HEAD=c=>`<tr><th>Date</th><th>Opening</th><th>Closing</th><th>To ${CASH[other(c)]||'Cashier'}</th>${OUTK.map(t=>`<th>${t}</th>`).join('')}<th>Total Received</th><th>Collection</th></tr>`;
function report(c){const m=window._m||today().slice(0,7);
 $('#app').innerHTML=`<div class="card"><h2>${CASH[c]} · Reports</h2><div class="ctl noprint"><div><label>Month</label><input type="month" id="mo" value="${m}"></div><button class="btn" onclick="csv('${c}')">Download CSV</button><button class="btn" onclick="try{print()}catch(e){}">Print</button></div><div id="rp"></div></div><div id="sheet"></div>`;
 $('#mo').onchange=()=>{window._m=$('#mo').value;rp(c)};rp(c)}
function rp(c){const m=$('#mo').value,L=list(c).filter(d=>d.date.startsWith(m));
 const s=k=>L.reduce((a,d)=>a+(k==='o'?0:d[k]),0),oo=i=>L.reduce((a,d)=>a+d.out[i],0);
 $('#rp').innerHTML=L.length?`<div class="sc"><table>${HEAD(c)}${L.map(rowsOf).join('')}<tr><th>Total</th><th></th><th></th>${[0,1,2,3,4,5,6].map(i=>`<th>${f(oo(i))}</th>`).join('')}<th>${f(s('received'))}</th><th>${f(s('collection'))}</th></tr></table></div><p class="mu noprint">Click a date to view the day sheet.</p>`:'<p class="mu">No entries for this month.</p>';
 $('#rp').querySelectorAll('tr').forEach((r,i)=>{const d=L[i-1];if(d){r.style.cursor='pointer';r.onclick=()=>sheet(d)}});$('#sheet').innerHTML=''}
function sheet(d){const o=CASH[other(d.cashier)];window._sd=d;$('#sheet').innerHTML=`<div class="card"><div class="noprint" style="margin-bottom:10px"><button class="btn p" onclick="printSheet()">Print</button> <button class="btn" onclick="dlSheet()">Download sheet (HTML)</button></div><h2>Cash Book – ${CASH[d.cashier]} · ${dmy(d.date)}</h2><div class="g g2"><div><div class="row"><span>Opening balance</span><b>${f(d.opening)}</b></div><table>${NOTES.map((v,i)=>d.notes[i]?`<tr><td>${v}</td><td>${d.notes[i]}</td><td>${f(d.notes[i]*v)}</td></tr>`:'').join('')}${COINS.map((v,i)=>d.coins[i]?`<tr><td>Coin ${v}</td><td>${d.coins[i]}</td><td>${f(d.coins[i]*v)}</td></tr>`:'').join('')}</table></div>
 <div><div class="row"><span>Cash closing balance</span><b>${f(d.closing)}</b></div>${[`Amount to ${o} Cashier`,...OUTK].map((t,i)=>`<div class="row"><span>${t}</span><b>${f(d.out[i])}</b></div>`).join('')}<div class="row"><span>Total cash received</span><b>${f(d.received)}</b></div><div class="row"><span>Opening for next day</span><b class="big">${f(d.closing)}</b></div>${d.remarks?`<p class="mu">Remarks: ${esc(d.remarks)}</p>`:''}</div></div><p class="mu" style="margin-top:30px">Prepared &amp; Checked By ________________ &nbsp;&nbsp;&nbsp; Verified By ________________</p></div>`;$('#sheet').scrollIntoView({behavior:'smooth'})}
async function csv(c,all){const L=all?list():list(c).filter(d=>d.date.startsWith($('#mo').value));
 const h=['Cashier','Date','Opening','Closing','To other cashier',...OUTK,'Total received','Collection','Remarks'];
 const t=[h,...L.map(d=>[CASH[d.cashier],d.date,d.opening,d.closing,...d.out,d.received,d.collection,d.remarks||''])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 if(!dl)return alert('Download not available here.');try{await dl.save({filename:'truelink-cashbook-'+(all?'all':c)+'.csv',data:t})}catch(e){}}
/* ---------- ADMIN ---------- */
function admin(){if(!isAdmin){$('#app').innerHTML='<div class="card"><h2>Admin Dashboard</h2><p class="mu">Admin access only. Please open this page as the owner or an editor.</p></div>';return}
 const t=today(),m=t.slice(0,7);window._f=window._f||m+'-01';window._t=window._t||t;
 $('#app').innerHTML=`<div class="ctl"><div><label>From</label><input type="date" id="f1" value="${window._f}"></div><div><label>To</label><input type="date" id="t1" value="${window._t}"></div><div><label>Cashier</label><select id="cs"><option value="">Both</option><option value="asna">Asna</option><option value="thasleena">Thasleena</option></select></div><button class="btn" onclick="csv('',1)">Download CSV (all)</button></div><div id="ad"></div>`;
 ['f1','t1','cs'].forEach(i=>$('#'+i).onchange=()=>{window._f=$('#f1').value;window._t=$('#t1').value;ad()});ad()}
function ad(){if(!$('#f1'))return;const a=$('#f1').value,b=$('#t1').value,c=$('#cs').value;if(!$('#ad'))return;
 const L=list(c).filter(d=>d.date>=a&&d.date<=b),S=k=>L.reduce((x,d)=>x+d[k],0),O=i=>L.reduce((x,d)=>x+d.out[i],0);
 const last=k=>{const p=list(k).pop();return p?p.closing:0};
 const kp=(t,v,col)=>`<div class="k" ${col?`style="border-left-color:${col}"`:''}><span>${t}</span><b>${f(v)}</b></div>`;
 // chart: collection per date, per cashier
 const ds=[...new Set(L.map(d=>d.date))],val=(k,x)=>(days[k+'_'+x]||{collection:0}).collection,mx=Math.max(1,...ds.flatMap(x=>['asna','thasleena'].map(k=>val(k,x)))),W=Math.max(560,ds.length*54),H=190;
 const bars=ds.map((x,i)=>['asna','thasleena'].map((k,j)=>{const h=Math.max(0,val(k,x))/mx*(H-40);return `<rect x="${i*54+10+j*20}" y="${H-24-h}" width="18" height="${h}" rx="3" fill="${j?'#b3202a':'#0f6b44'}"><title>${CASH[k]} ${dmy(x)}: ${f(val(k,x))}</title></rect>`}).join('')+`<text x="${i*54+30}" y="${H-8}" font-size="10" text-anchor="middle" fill="currentColor">${x.slice(5).split('-').reverse().join('/')}</text>`).join('');
 $('#ad').innerHTML=`<div class="g g4" style="margin-bottom:14px">${kp('Total cash received',S('received'))}${kp("Collection (received − opening)",S('collection'))}${kp('Total handed over / paid',S('outTotal'),'#b3202a')}${kp('Asna closing (latest)',last('asna'),'#222')}${kp('Thasleena closing (latest)',last('thasleena'),'#222')}</div>
 <div class="g g2"><div class="card"><h2>Where the cash went</h2>${['Between cashiers',...OUTK].map((t,i)=>`<div class="row"><span>${t}</span><b>${f(O(i))}</b></div>`).join('')}</div>
 <div class="card"><h2>Daily collection</h2><div class="sc">${ds.length?`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${bars}</svg>`:'<p class="mu">No data in range.</p>'}</div><span class="mu"><b style="color:#0f6b44">■</b> Asna &nbsp; <b style="color:#b3202a">■</b> Thasleena</span></div></div>
 <div class="card"><h2>All entries</h2><div class="sc"><table><tr><th>Date</th><th>Cashier</th><th>Opening</th><th>Closing</th><th>Handed over / paid</th><th>Total received</th><th>Collection</th></tr>${L.slice().reverse().map(d=>`<tr><td>${dmy(d.date)}</td><td style="text-align:left">${CASH[d.cashier]}</td><td>${f(d.opening)}</td><td>${f(d.closing)}</td><td>${f(d.outTotal)}</td><td><b>${f(d.received)}</b></td><td>${f(d.collection)}</td></tr>`).join('')||'<tr><td colspan="7" class="mu">No entries.</td></tr>'}</table></div></div>`}
/* ---------- INIT ---------- */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let role=null;
const dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=filename;a.click()}};
async function logout(){await sb.auth.signOut();location.href='/'}
function loginUI(){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h2>Sign in</h2><label class="mu">Email</label><input id="em" type="email"><label class="mu" style="margin-top:8px;display:block">Password</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')login()"><p><button class="btn p" onclick="login()">Sign in</button> <span id="le" style="color:#b3202a"></span></p></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#le').textContent='Wrong email or password';else boot()}
async function loadDays(){const {data,error}=await sb.from('cash_days').select('id,payload');if(error)return;days={};data.forEach(r=>{if(r.payload&&r.payload.notes)days[r.id]=r.payload})}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return loginUI();
 const {data:p}=await sb.from('profiles').select('role').eq('user_id',session.user.id).maybeSingle();role=p&&p.role;
 if(!role){$('#nav').innerHTML='';$('#app').innerHTML='<div class="card">This account has no role yet. Please ask the admin. <button class="btn" onclick="logout()">Sign out</button></div>';return}
 isAdmin=role==='admin';col=true;conn=true;const path=location.pathname.replace(/\/+$/,'').slice(1);
 if(!isAdmin&&path!==role){location.replace('/'+role);return}
 await loadDays();route();if(isAdmin)setInterval(async()=>{await loadDays();if(view==='admin')ad()},30000)}
boot();
</script></body></html>
