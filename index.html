body.ps .ph{display:none!important}@media print{.inv{max-width:none!important;border:0!important}}@media print{:root,:root[data-theme]{--tx:#000;--mu:#444;--bd:#bbb;--card:#fff;--hd:#eee;--in:#fff}}.sig{font:italic 22px "Segoe Script","Brush Script MT",cursive;border-bottom:1px solid var(--tx);padding:0 14px;display:inline-block;min-width:150px}.sg{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:34px}.sg small{display:block;color:var(--mu)}@page{size:A4;margin:10mm}body.ps .hd{display:none!important}@media print{.pr{border:0!important;padding:0!important}}</style></head><body><div class="w">
<div class="hd"><img id="hl" alt="Amer" src="/logo-amer.png"><div><small>Cash Book System</small><h1 id="hn">True Link Government Transaction Center LLC</h1><div class="bar"><i style="background:#b3202a"></i><i style="background:#222"></i><i style="background:#0f6b44"></i></div><small style="letter-spacing:.05em;text-transform:none">Internal. Not for customers.</small></div><img id="hr" alt="True Link" src="/logo-truelink.png"></div>
<div class="nav" id="nav"></div><div id="msg"></div><div id="app"></div><div id="rf" class="mu noprint" style="text-align:center;font-size:11px;margin-top:12px"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const CASH={asna:'Asna',thasleena:'Thasleena'},NOTES=[1000,500,200,100,50,20,10,5],COINS=[1,0.5,0.25];
const OUTK=['Petty Cash','SHAKKEER/MANSOOR','NOQODI','NBD','Cash Expense'];
let days={},col=null,isAdmin=false,tab='entry',view=null,conn=false;
const $=s=>document.querySelector(s),f=n=>(+String(n).replace(/,/g,'')||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),f0=n=>(+String(n).replace(/,/g,'')||0).toLocaleString('en-US'),
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
dmy=s=>s.split('-').reverse().join('/'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const other=c=>c==='asna'?'thasleena':'asna';
const list=c=>Object.values(days).filter(d=>!c||d.cashier===c).sort((a,b)=>a.date<b.date?-1:1);
const prevClose=(c,date)=>{const p=list(c).filter(d=>d.date<date).pop();return p?p.closing:0};
function calc(d){const n=d.notes.reduce((s,q,i)=>s+q*NOTES[i],0)+(d.reserved=+d.reserved||0),c=d.coins.reduce((s,q,i)=>s+q*COINS[i],0),o=d.out.reduce((s,v)=>s+v,0);
 d.notesTotal=n;d.coinsTotal=c;d.closing=n+c;d.outTotal=o;d.received=d.closing+o;d.collection=d.received-d.opening;d.erpDiff=(d.erp===''||d.erp==null)?null:Math.round((d.closing-d.erp)*100)/100;return d}
function route(){const h=location.pathname.replace(/\/+$/,'').slice(1);view=CASH[h]?h:(h==='admin'||h==='shabeeb'?'admin':null);window._who=h==='shabeeb'?'Shabeeb':'';window._sec='';window._sub='';window._tb='';tab='entry';render()}
function renderNav(){const l=[['','Home'],['asna','Asna Cash Book'],['thasleena','Thasleena Cash Book'],['admin','Admin Dashboard'],['shabeeb','Shabeeb']];
 $('#nav').innerHTML=CASH[view]?`<b style="margin-right:12px;font-size:26px">${CASH[view]} Cash Book</b>`:l.map(([h,t])=>`<a href="/${h}" class="${((view==='admin'&&window._who==='Shabeeb')?'shabeeb':(view||''))===h?'on':''}">${t}</a>`).join('');
 if(view&&CASH[view])$('#nav').innerHTML+=`<span style="flex:1"></span><button class="btn ${tab==='entry'?'p':''}" onclick="setTab('entry')">Amer Cashbook</button><button class="btn ${tab==='report'?'p':''}" onclick="setTab('report')">Reports</button><button class="btn ${tab==='exp'?'p':''}" onclick="setTab('exp')">Expense Sheet</button><button class="btn ${tab==='tl'||tab==='tlr'?'p':''}" onclick="setTab('tl')">Tawjeeh Cashbook</button>${view==='asna'?`<button class="btn ${tab==='bal'?'p':''}" onclick="setTab('bal')">Account Balance &amp; Sales Report</button>`:''}${view==='asna'?`<button class="btn ${tab==='admin'?'p':''}" onclick="setTab('admin')">Admin Dashboard</button>`:''}`}
function setTab(t){tab=t;render()}
function render(){window._corr=null;renderNav();setHeader();chInit();$('#msg').innerHTML=vrBanner()+(conn?'':'<div class="warn">Not connected to the shared database. Open this page signed in to claude.ai; entries cannot be saved until then.</div>');
 const a=$('#app');
 if(!view)a.innerHTML=`<div class="g g4">${['asna','thasleena'].map(c=>`<a class="card lk" href="/${c}"><b>${CASH[c]}</b><span class="mu">Cashier cash book, entry and reports</span></a>`).join('')}<a class="card lk" href="/admin"><b>Admin</b><span class="mu">Cash flow dashboard</span></a><a class="card lk" href="/shabeeb"><b>Shabeeb</b><span class="mu">Approvals and dashboard</span></a></div>`;
 else if(view==='admin'||tab==='admin')admin();else if(tab==='tl')tlEntry();else if(tab==='bal')adminBal();else if(tab==='tlr')tlReport();else if(tab==='exp')expDay();else if(tab==='entry')entry(view);else report(view)}
/* ---------- ENTRY ---------- */
function entry(c){window._ec=c;const o=CASH[other(c)];
 $('#app').innerHTML=`<div class="noprint">${corrHtml()}<div class="card"><h2>${CASH[c]} · Daily Cash Book</h2><div class="ctl"><div><label>Date</label><input type="date" id="dt" value="${today()}"></div><div><label>Opening Balance</label><input type="text" inputmode="decimal" class="cm" step="0.01" id="op"></div>${c==='asna'?`<div><label>Prepared &amp; Checked By</label><select id="pb"><option>Asna</option><option>Nazik</option><option>Shabeeb</option></select></div>`:''}<div style="flex:1"><span id="st" class="mu"></span></div></div>
 <div id="vrb"></div><div class="g g2"><div><h3>Cash Denominations</h3><div class="sc"><table><tr><th>Currency</th><th>Qty</th><th>Amount</th></tr>${NOTES.map((v,i)=>`<tr><td>${v}</td><td><input type="text" inputmode="decimal" class="cm" data-int="1" min="0" id="n${i}" oninput="upd()"></td><td id="na${i}">0.00</td></tr>`).join('')}<tr><td>Reserved Amount</td><td><input type="text" inputmode="decimal" class="cm" step="0.01" min="0" id="rs" oninput="upd()"></td><td id="rsa">0.00</td></tr><tr><th>Total</th><th id="nq">0</th><th id="nt">0.00</th></tr></table></div></div>
 <div><h3>Coin Denominations</h3><div class="sc"><table><tr><th>Coin</th><th>Qty</th><th>Amount</th></tr>${COINS.map((v,i)=>`<tr><td>${v}</td><td><input type="text" inputmode="decimal" class="cm" data-int="1" min="0" id="c${i}" oninput="upd()"></td><td id="ca${i}">0.00</td></tr>`).join('')}<tr><th>Total</th><th id="cq">0</th><th id="ct">0.00</th></tr></table></div>
 <h3 style="margin-top:16px">Cash Closing Balance</h3><div class="row"><span>Closing balance</span><b class="big" id="cl">0.00</b></div></div></div></div>
 <div class="g g2"><div class="card"><h3>Amounts Handed Over / Paid</h3>${OUTK.map((t,i)=>`<div class="row"><span>${t}</span><input type="text" inputmode="decimal" class="cm" step="0.01" min="0" id="o${i}" oninput="upd()" style="width:140px"></div>`).join('')}<div class="row"><span>Remarks</span><input id="rm" style="width:60%" placeholder="optional"></div></div>
 <div class="card"><h3>Summary</h3><div class="row"><span>Total handed over / paid</span><b id="ot">0.00</b></div><div class="row"><span>Total cash received</span><b id="tr">0.00</b></div><div class="row"><span>Today's collection (received − opening)</span><b id="co">0.00</b></div><div class="row"><span>Opening for next day</span><b class="big" id="nx">0.00</b></div>${c==='thasleena'?`<div class="row"><span>NOQODI Closing Balance <b style="color:#c0262f">*</b></span><input type="text" inputmode="decimal" class="cm" id="nqb" style="width:160px"></div><div class="row"><span>AMWAL Closing Balance <b style="color:#c0262f">*</b></span><input type="text" inputmode="decimal" class="cm" id="amb" style="width:160px"></div>`:''}<div class="row"><span>ERP Closing <b style="color:#c0262f">*</b> <small class="mu">(required to submit)</small></span><input type="text" inputmode="decimal" class="cm" id="erp" oninput="upd()" style="width:160px"></div><div class="row"><span>Difference</span><span id="erd"></span></div><p style="margin-top:14px">${window._corr?`<button class="btn p" onclick="save()">Save correction</button> <button class="btn" onclick="cancelCorr()">Cancel</button>`:`<button class="btn" onclick="save()">Save</button> <button class="btn p" style="background:#b3202a;border-color:#b3202a" onclick="submitDay()">Submit for Verification</button> <button class="btn p" onclick="printDay()">Print</button>`} <button class="btn d" onclick="del()">Delete this day</button> <span id="sv" class="ok"></span></p></div></div></div><div id="sheet"></div>`;
 $('#dt').onchange=()=>load(c);$('#op').oninput=()=>{$('#op').dataset.m=1;upd()};load(c);$('#app').oninput=()=>{eDirty=true}}
function load(c){eDirty=false;const dt=$('#dt').value,d=days[c+'_'+dt],sr=d||list(c).filter(x=>x.date<dt).pop();$('#sv').textContent='';
 $('#op').dataset.m='';$('#op').value=d?d.opening:prevClose(c,dt);
 NOTES.forEach((_,i)=>$('#n'+i).value=sr?sr.notes[i]||'':'');COINS.forEach((_,i)=>$('#c'+i).value=sr?sr.coins[i]||'':'');
 for(let i=0;i<5;i++)$('#o'+i).value=d?d.out[i]||'':'';$('#rs').value=sr?sr.reserved||'':'';$('#erp').value=d&&d.erp!=null?d.erp:'';if($('#nqb')){$('#nqb').value=d&&d.nqb!=null?d.nqb:'';$('#amb').value=d&&d.amb!=null?d.amb:''}$('#vrb').innerHTML=vrHtml(d);if($('#pb'))$('#pb').value=d&&d.preparedBy?d.preparedBy:(window._who==='Shabeeb'?'Shabeeb':'Asna');$('#rm').value=d?d.remarks||'':'';
 $('#st').textContent=d?'Editing a saved entry for this date. Status: '+(d.verifiedBy?'Verified by '+d.verifiedBy:isSub(d)?'Submitted, waiting for verification':'Draft (not submitted yet)')+'.':'New entry. Opening balance and denominations are copied from the previous day; change them if the cash count differs.';fmtInputs();upd()}
function cur(){const g=id=>num($(id).value);return calc({cashier:window._ec,submitted:0,erp:oq('#erp'),nqb:oq('#nqb'),amb:oq('#amb'),date:$('#dt').value,opening:g('#op'),reserved:g('#rs'),preparedBy:$('#pb')?$('#pb').value:CASH[window._ec],notes:NOTES.map((_,i)=>g('#n'+i)),coins:COINS.map((_,i)=>g('#c'+i)),out:[0,1,2,3,4].map(i=>g('#o'+i)),remarks:$('#rm').value.trim()})}
function upd(){const d=cur();NOTES.forEach((v,i)=>$('#na'+i).textContent=f(d.notes[i]*v));COINS.forEach((v,i)=>$('#ca'+i).textContent=f(d.coins[i]*v));
 $('#nq').textContent=f0(d.notes.reduce((a,b)=>a+b,0));$('#cq').textContent=f0(d.coins.reduce((a,b)=>a+b,0));$('#nt').textContent=f(d.notesTotal);$('#rsa').textContent=f(d.reserved);$('#ct').textContent=f(d.coinsTotal);
 $('#cl').textContent=f(d.closing);$('#erd').innerHTML=diffMsg(d);$('#ot').textContent=f(d.outTotal);$('#tr').textContent=f(d.received);$('#co').textContent=f(d.collection);$('#nx').textContent=f(d.closing)}
async function save(p,sub){if(!col)return alert('Not connected to the database.');const d=cur();if(!d.date)return alert('Pick a date.');if(!sub&&!window._corr){const old=days[d.cashier+'_'+d.date];if(old&&isSub(old)&&!confirm('This day has already been sent for verification'+(old.verifiedBy?' and verified by '+old.verifiedBy:'')+'.\nSaving your changes will recall it from the verifier, and you will need to send it for verification again.\n\nDo you want to continue?'))return}
 if(sub){const miss=[];if(d.erp==='')miss.push('ERP Closing');if($('#nqb')){if(d.nqb==='')miss.push('NOQODI Closing Balance');if(d.amb==='')miss.push('AMWAL Closing Balance')}if(miss.length){$(d.erp===''?'#erp':(d.nqb===''?'#nqb':'#amb')).focus();return alert('Please fill the mandatory field(s) before submitting for verification: '+miss.join(', ')+'.')}}d.updated=Date.now();if(sub)d.submitted=Date.now();{const old=days[d.cashier+'_'+d.date];if(old&&old.vr)d.vr=old.vr.map(x=>x.open?{...x,open:false,doneAt:Date.now()}:x)}
 if(window._corr){const t=($('#ct')||{}).value;if(!t||!t.trim())return alert('Please type the remark for the cashier.');const by=$('#cv').value,o2=days[d.cashier+'_'+d.date];d.vr=[...(d.vr||[]),{by,text:t.trim(),at:Date.now(),open:false,corrected:true,was:o2?{closing:o2.closing,received:o2.received}:null}];d.verifiedBy=by;d.verifiedAt=today();d.submitted=(o2&&o2.submitted)||Date.now()}

 try{const {error}=await sb.from('cash_days').upsert({id:d.cashier+'_'+d.date,cashier:d.cashier,day:d.date,payload:d});if(error)throw error;days[d.cashier+'_'+d.date]=d;eDirty=false;$('#sv').textContent='Saved as draft ✓ – click Submit for Verification when it is final';$('#msg').innerHTML=vrBanner();if(window._corr){window._corr=null;go('amer','daily','vf');return}if(sub){const chk=await sb.from('cash_days').select('payload').eq('id',d.cashier+'_'+d.date).maybeSingle();if(chk.error||!chk.data||!chk.data.payload||!chk.data.payload.submitted)throw new Error('The submission could not be confirmed. Please try again.');$('#sv').textContent='';sxShow(d.erpDiff<0?'red':'green',d.erpDiff,'verify');if(isAdmin){go('amer','daily','vf');afterAction();return}}if(sub)sheet(d);else $('#sheet').innerHTML='';afterAction()}catch(e){alert('Could not save: '+(e.message||e.code))}}
async function del(){const d=$('#dt').value,id=window._ec+'_'+d;if(!days[id])return;if(!confirm('Delete the entry for '+dmy(d)+'?'))return;try{const {error}=await sb.from('cash_days').delete().eq('id',id);if(error)throw error;delete days[id];load(window._ec);afterAction()}catch(e){alert('Could not delete: '+(e.message||e.code))}}
function printSheet(){const t0=document.title;if(window._pt)document.title=window._pt;document.body.classList.add('ps');psPrepare();try{print()}catch(e){alert('Printing is blocked in this view. Use Download sheet, then print the file.')}setTimeout(()=>{document.body.classList.remove('ps');psClear();document.title=t0;afterAction()},1500)}
async function dlSheet(){if(!dl)return alert('Download not available here.');const el=$('#sheet').cloneNode(true);el.querySelectorAll('.noprint').forEach(x=>x.remove());
 const h=`<!DOCTYPE html><meta charset=utf-8><title>Cash Book ${_sd.date}</title><style>body{font-family:'Century Gothic',CenturyGothic,AppleGothic,Questrial,'Segoe UI',Arial,sans-serif}${PRCSS}body{margin:16px;background:#fff}.pr{border:0}@page{size:A4;margin:10mm}</style>${el.innerHTML.replace(/src="\//g,'src="'+location.origin+'/')}`;
 try{await dl.save({filename:(window._pt||'Cashbook')+'.html',data:h})}catch(e){}}
function printReport(c){const m=$('#mo').value,L=list(c).filter(d=>d.date.startsWith(m));if(!L.length)return alert('No entries this month.');
 const oo=i=>L.reduce((a,d)=>a+d.out[i],0),S=k=>L.reduce((a,d)=>a+d[k],0),mn=new Date(m+'-01T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'}),vf=L.filter(d=>d.verifiedBy).length;
 $('#sheet').innerHTML=`<div class="pr rt"><div class="lh"><img alt="" src="/logo-amer.png"><div><h1>True Link Government Transaction Center LLC</h1><div class="tri"><i style="background:#b3202a"></i><i style="background:#222"></i><i style="background:#0f6b44"></i></div><small>Cash Book</small></div><img alt="" src="/logo-truelink.png"></div>
<div class="tt">MONTHLY CASH REPORT</div>
<div class="mt"><div><small>Cashier</small><b>${CASH[c]}</b></div><div><small>Period</small><b>${mn}</b></div><div><small>Entries</small><b>${L.length}</b></div><div><small>Verified</small><b>${vf} of ${L.length}</b></div></div>
<table><tr><th>Date</th><th>Opening</th><th>Closing</th>${OUTK.map(t=>`<th>${t}</th>`).join('')}<th>Total Received</th><th>Collection</th><th>ERP Diff</th><th>Prepared By</th><th>Verified By</th><th>Verifier Remarks</th></tr>${L.map(d=>`<tr><td>${dmy(d.date)}</td><td>${f(d.opening)}</td><td>${f(d.closing)}</td>${d.out.map(v=>`<td>${f(v)}</td>`).join('')}<td><b>${f(d.received)}</b></td><td>${f(d.collection)}</td><td>${diffCell(d)}</td><td>${esc(d.preparedBy||CASH[c])}</td><td>${d.verifiedBy?esc(d.verifiedBy):(isSub(d)?'Pending':'Draft')}</td><td style="font-size:9px">${esc(vrText(d))}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td></td><td></td>${[0,1,2,3,4].map(i=>`<td>${f(oo(i))}</td>`).join('')}<td></td><td>${f(S('collection'))}</td><td></td><td></td><td></td><td></td></tr></table>
<div class="sg"><div><span class="sig">${[...new Set(L.map(d=>d.preparedBy||CASH[c]))].join(' / ')}</span><small>Prepared &amp; Checked By</small></div><div><span class="sig">&nbsp;</span><small>Verified By</small></div></div>
<div class="ft"><span>True Link Cash Book · Internal document</span><span>Printed ${new Date().toLocaleString('en-GB')}</span></div></div>`;
 const st=document.createElement('style');st.textContent='@page{size:A4 landscape;margin:8mm}';document.head.appendChild(st);document.body.classList.add('ps');psPrepare();

function chToggle(){chOpen=!chOpen;document.getElementById('chp').classList.toggle('on',chOpen);if(chOpen){chRender();chSeen();setTimeout(()=>{const i=document.getElementById('chi');if(i)i.focus()},50)}}
function chSeen(){if(CHM.length)ls('ch_seen',CHM[CHM.length-1].id);chBadge()}
function chBadge(){const g=document.getElementById('chg');if(!g)return;const n=chOpen?0:CHM.filter(m=>m.id>(ls('ch_seen')||'')&&m.name!==chNm()).length;g.textContent=n>99?'99+':n;g.style.display=n?'inline-block':'none'}
function chRender(){const el=document.getElementById('chm');if(!el)return;el.innerHTML=CHM.length?CHM.map(m=>{const me=m.name===chNm();return `<div class="cmsg${me?' me':''}"><b style="color:${me?'#fff':chCol(m.name)}">${esc(m.name)}</b>${esc(m.text)}<small>${chT(m.at)}</small></div>`}).join(''):'<div class="chn0">No messages yet. Say hello! \uD83D\uDC4B</div>';el.scrollTop=el.scrollHeight}
async function chPoll(){if(!view)return;const r=await sb.from('exp_docs').select('id,payload').like('id','chat_%').order('id',{ascending:false}).limit(60);if(r.error)return;
 const L=(r.data||[]).reverse().map(x=>({id:x.id,...x.payload})),prev=new Set(CHM.map(m=>m.id));CHM=L;
 if(!chReady){chReady=true;if(ls('ch_seen')===null&&L.length)ls('ch_seen',L[L.length-1].id)}
 else if(L.some(m=>!prev.has(m.id)&&m.name!==chNm())){ding();flashTitle('\uD83D\uDCAC New chat message')}
 if(chOpen){chRender();chSeen()}chBadge()}
async function chSend(){const i=document.getElementById('chi'),t=i.value.trim();if(!t)return;i.value='';const m={id:'chat_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name:chNm(),text:t.slice(0,300),at:Date.now()};CHM.push(m);chRender();chSeen();
 const {error}=await sb.from('exp_docs').upsert({id:m.id,payload:{name:m.name,text:m.text,at:m.at}});if(error)alert('Message not sent: '+error.message)}
async function chClear(){if(!confirm('Delete all chat messages for everyone?'))return;const {error}=await sb.from('exp_docs').delete().like('id','chat_%');if(error)return alert('Could not clear: '+error.message);CHM=[];ls('ch_seen','');chRender();chBadge()}
setInterval(chPoll,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chPoll()});

boot();
</script></body></html>
